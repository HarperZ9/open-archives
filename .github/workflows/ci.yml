# SPDX-License-Identifier: AGPL-3.0-only
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg for the clean-room tests
        run: python -m pip install imageio-ffmpeg
      - name: Run the test suite
        shell: bash
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
          grep -q "^Ran 35 tests" test-output.txt || { echo "expected 35 tests"; exit 1; }
